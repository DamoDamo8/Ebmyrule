name: Auto Sync YAML to List

on:
  push:
    paths:
      - 'emby_rules.yaml'
      - '.github/workflows/*.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. 拉取仓库
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # 2. Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      # 3. YAML 转 LIST
      - name: Convert YAML to List
        run: |
          python <<'PY'
          import re

          with open("emby_rules.yaml", "r", encoding="utf-8") as f:
              lines = f.readlines()


          output_lines = []


          for line in lines:

              # 删除 payload:
              if line.strip().startswith("payload:"):
                  continue


              # 匹配 YAML 列表规则
              match = re.match(r'^(\s*)-\s+(.*)$', line)


              if match:

                  indent, content = match.groups()


                  # 保留被注释的规则
                  if content.startswith("#"):
                      output_lines.append(line)

                  else:
                      # 去掉 "- "，保持规则原文
                      output_lines.append(
                          content.rstrip("\r\n") + "\n"
                      )


              else:

                  # 保留普通注释、空行
                  output_lines.append(line)



          with open(
              "emby_rules.list",
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:
              f.writelines(output_lines)


          print("emby_rules.list generated")
          PY



      # 4. 提交生成文件
      - name: Commit and Push Changes
        run: |

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add emby_rules.list


          if git diff --cached --quiet; then
              echo "No changes"
          else
              git commit -m "chore: auto-sync emby_rules.list [skip ci]"
              git push
          fi
