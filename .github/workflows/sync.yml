name: Auto Sync List and Split Compile MRS

on:
  push:
    paths:
      - 'emby_rules.yaml' # 只有手动改这个文件时才触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1. 纯文本同步原原本本的 emby_rules.list
      - name: Convert YAML to List (Keep Format)
        run: |
          python -c "
          import re

          with open('emby_rules.yaml', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          output_lines = []
          for line in lines:
              if line.strip().startswith('payload:'):
                  continue
              match = re.match(r'^(\s*)-\s+(.*)$', line)
              if match:
                  indent, content = match.groups()
                  if content.startswith('#'):
                      output_lines.append(line)
                  else:
                      output_lines.append(f'{content}\n')
              else:
                  output_lines.append(line)

          with open('emby_rules.list', 'w', encoding='utf-8') as f:
              f.writelines(output_lines)
          "

      # 2. 强力清洗切片：绝不依赖 pyyaml 库，纯文本秒级分流
      - name: Split YAML into Domain and IP
        run: |
          python -c "
          import re

          with open('emby_rules.yaml', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          domains = []
          ips = []

          for line in lines:
              match = re.match(r'^(\s*)-\s+(.*)$', line)
              if match:
                  indent, content = match.groups()
                  if content.strip().startswith('#'):
                      continue
                  clean_rule = re.sub(r'\s*#.*$', '', content).strip()
                  if not clean_rule:
                      continue
                  parts = [p.strip() for p in clean_rule.split(',')]
                  if not parts:
                      continue
                  
                  rule_type = parts[0].upper()
                  standard_rule = ','.join(parts)
                  
                  if any(rule_type.startswith(p) for p in ['IP-CIDR', 'IP-ASN', 'GEOIP']):
                      ips.append(f'  - {standard_rule}\n')
                  elif any(rule_type.startswith(p) for p in ['DOMAIN', 'GEOSITE']):
                      domains.append(f'  - {standard_rule}\n')

          if domains:
              with open('emby_domain.yaml', 'w', encoding='utf-8') as f:
                  f.write('payload:\n')
                  f.writelines(domains)
          if ips:
              with open('emby_ip.yaml', 'w', encoding='utf-8') as f:
                  f.write('payload:\n')
                  f.writelines(ips)
          "

      # 3. 编译出高性能的 .mrs 文件
      - name: Compile MRS Files via Mihomo
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.18.9/mihomo-linux-amd64-v1.18.9.gz
          gunzip mihomo-linux-amd64-v1.18.9.gz
          mv mihomo-linux-amd64-v1.18.9 mihomo
          chmod +x mihomo

          if [ -f emby_domain.yaml ]; then
              ./mihomo cli ruleset compile --behavior domain emby_domain.yaml emby_domain.mrs
          fi
          if [ -f emby_ip.yaml ]; then
              ./mihomo cli ruleset compile --behavior ipcidr emby_ip.yaml emby_ip.mrs
          fi

      # 4. 终极防死循环安全提交
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add emby_rules.list
          [ -f emby_domain.mrs ] && git add emby_domain.mrs
          [ -f emby_ip.mrs ] && git add emby_ip.mrs
          
          # 【核心改动】这里的 [skip ci] 会明确命令 GitHub：这是 Actions 机器人的自动提交，千万不要再次触发 Build！
          git diff-index --quiet HEAD || git commit -m "chore: auto-sync all files safely [skip ci]"
          git push
