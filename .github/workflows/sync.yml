name: Auto Sync Emby Rules and Compile MRS

on:
  push:
    paths:
      - 'emby_rules.yaml'
      - '.github/workflows/*.yml'

permissions:
  contents: write


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. 拉取仓库
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # 2. Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      # 3. YAML 转 LIST
      - name: Convert YAML to List
        run: |
          python <<'PY'
          import re

          with open("emby_rules.yaml", "r", encoding="utf-8") as f:
              lines = f.readlines()

          out = []

          for line in lines:

              if line.strip() == "payload:":
                  continue

              m = re.match(r'^\s*-\s+(.*)$', line)

              if m:
                  content = m.group(1).strip()

                  if content:
                      out.append(content + "\n")
              else:
                  out.append(line)


          with open("emby_rules.list", "w", encoding="utf-8") as f:
              f.writelines(out)


          print("emby_rules.list generated")

          PY



      # 4. 分离 DOMAIN / IP
      - name: Split Rules
        run: |
          python <<'PY'
          import re

          domains = []
          ips = []


          with open("emby_rules.yaml", "r", encoding="utf-8") as f:
              lines = f.readlines()


          for line in lines:

              m = re.match(r'^\s*-\s+(.*)$', line)

              if not m:
                  continue


              rule = m.group(1).strip()


              if rule.startswith("#"):
                  continue


              # 删除尾部注释
              rule = re.sub(r'\s+#.*$', '', rule).strip()


              if not rule:
                  continue


              parts = [
                  x.strip()
                  for x in rule.split(",")
              ]


              kind = parts[0].upper()



              # IP-CIDR
              if kind == "IP-CIDR":

                  if len(parts) >= 2:
                      ips.append(parts[1] + "\n")



              # DOMAIN / DOMAIN-SUFFIX
              elif kind in ("DOMAIN", "DOMAIN-SUFFIX"):

                  if len(parts) >= 2:

                      domains.append(
                          f"  - {kind},{parts[1]}\n"
                      )



          if domains:

              with open(
                  "emby_domain.yaml",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write("payload:\n")
                  f.writelines(domains)



          if ips:

              with open(
                  "emby_ip.txt",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.writelines(ips)



          print("domains:", len(domains))
          print("ips:", len(ips))

          PY




      # 5. Mihomo 编译 MRS
      - name: Compile MRS Files
        run: |

          set -e


          VERSION=v1.19.19


          # 清理旧生成文件
          rm -f \
          emby_domain.mrs \
          emby_ip.mrs \
          emby_domain.yaml \
          emby_ip.txt



          wget -q \
          https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz



          # 下载检测
          test -s mihomo-linux-amd64-${VERSION}.gz



          gunzip mihomo-linux-amd64-${VERSION}.gz



          mv mihomo-linux-amd64-${VERSION} mihomo



          chmod +x mihomo



          echo "Mihomo Version:"
          ./mihomo -v




          # DOMAIN MRS

          if [ -s emby_domain.yaml ]; then

              echo "Compile domain mrs"


              ./mihomo convert-ruleset \
                domain \
                yaml \
                emby_domain.yaml \
                emby_domain.mrs

          fi




          # IP MRS

          if [ -s emby_ip.txt ]; then

              echo "Compile ip mrs"


              ./mihomo convert-ruleset \
                ipcidr \
                text \
                emby_ip.txt \
                emby_ip.mrs

          fi




          echo "MRS compile completed"


          ls -lh *.mrs || true





      # 6. 提交生成文件
      - name: Commit Changes
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add .



          if git diff --cached --quiet; then

              echo "No changes"

          else

              git commit \
              -m "chore: auto compile emby rules [skip ci]"


              git push

          fi
