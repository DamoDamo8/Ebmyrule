name: Auto Sync Emby Rules and Compile MRS

on:
  push:
    paths:
      - 'emby_rules.yaml'
      - '.github/workflows/*.yml'

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. 拉取仓库
      - name: Checkout Repository
        uses: actions/checkout@v4


      # 2. Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      # 3. YAML 转 LIST
      - name: Convert YAML to List
        run: |
          python <<'PY'
          import re

          with open('emby_rules.yaml', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          output = []

          for line in lines:

              if line.strip().startswith('payload:'):
                  continue

              match = re.match(r'^(\s*)-\s+(.*)$', line)

              if match:
                  _, content = match.groups()

                  if content.startswith('#'):
                      output.append(line)
                  else:
                      output.append(content + '\n')

              else:
                  output.append(line)


          with open('emby_rules.list', 'w', encoding='utf-8') as f:
              f.writelines(output)


          print("emby_rules.list generated")
          PY



      # 4. 拆分 DOMAIN / IP
      - name: Split YAML into Domain and IP
        run: |
          python <<'PY'
          import re


          with open('emby_rules.yaml', 'r', encoding='utf-8') as f:
              lines = f.readlines()


          domains = []
          ips = []


          for line in lines:

              m = re.match(r'^(\s*)-\s+(.*)$', line)

              if not m:
                  continue


              _, content = m.groups()


              if content.strip().startswith('#'):
                  continue


              content = re.sub(r'\s+#.*$', '', content).strip()


              if not content:
                  continue


              parts = [x.strip() for x in content.split(',')]

              rule_type = parts[0].upper()

              rule = ','.join(parts)



              if rule_type.startswith(
                  ('IP-CIDR', 'IP-ASN', 'GEOIP')
              ):
                  ips.append(
                      "  - " + rule + "\n"
                  )


              elif rule_type.startswith(
                  ('DOMAIN', 'GEOSITE')
              ):
                  domains.append(
                      "  - " + rule + "\n"
                  )



          if domains:

              with open('emby_domain.yaml','w',encoding='utf-8') as f:
                  f.write('payload:\n')
                  f.writelines(domains)



          if ips:

              with open('emby_ip.yaml','w',encoding='utf-8') as f:
                  f.write('payload:\n')
                  f.writelines(ips)



          print("Split finished")
          PY




      # 5. Mihomo 编译 MRS
      - name: Compile MRS Files
        run: |

          set -e


          VERSION=v1.19.19


          wget -q --show-progress \
          https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz



          gunzip mihomo-linux-amd64-${VERSION}.gz


          mv mihomo-linux-amd64-${VERSION} mihomo


          chmod +x mihomo



          echo "Mihomo Version:"
          ./mihomo -v



          # DOMAIN MRS
          if [ -f emby_domain.yaml ]; then

            ./mihomo convert-ruleset \
              domain \
              emby_domain.yaml \
              emby_domain.mrs

          fi



          # IP MRS
          if [ -f emby_ip.yaml ]; then

            ./mihomo convert-ruleset \
              ipcidr \
              emby_ip.yaml \
              emby_ip.mrs

          fi



          echo "MRS compile completed"


          echo "Generated files:"
          ls -lh *.mrs || true




      # 6. 提交生成文件
      - name: Commit and Push Changes
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add emby_rules.list


          [ -f emby_domain.yaml ] && git add emby_domain.yaml

          [ -f emby_ip.yaml ] && git add emby_ip.yaml


          [ -f emby_domain.mrs ] && git add emby_domain.mrs

          [ -f emby_ip.mrs ] && git add emby_ip.mrs



          if git diff --cached --quiet; then

              echo "No changes to commit"

          else

              git commit \
              -m "chore: auto compile emby rules [skip ci]"

              git push

          fi
