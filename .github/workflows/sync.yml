name: Auto Sync List and Split Compile MRS

on:
  push:
    paths:
      - 'emby_rules.yaml' # 当你修改这个文件时触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      # 1. 继续完美同步你原本的 emby_rules.list 文件（保留所有注释、去横杠）
      - name: Convert YAML to List (Keep Format)
        run: |
          python -c "
          import re

          with open('emby_rules.yaml', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          output_lines = []
          for line in lines:
              if line.strip().startswith('payload:'):
                  continue
              match = re.match(r'^(\s*)-\s+(.*)$', line)
              if match:
                  indent, content = match.groups()
                  if content.startswith('#'):
                      output_lines.append(line)
                  else:
                      output_lines.append(f'{content}\n')
              else:
                  output_lines.append(line)

          with open('emby_rules.list', 'w', encoding='utf-8') as f:
              f.writelines(output_lines)
          "

      # 2. 智能拆分：完美支持 IP-CIDR6 和 IP-ASN 并归类
      - name: Split YAML into Domain and IP
        run: |
          python -c "
          import yaml

          with open('emby_rules.yaml', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)

          payload = data.get('payload', [])
          
          domains = []
          ips = []

          for item in payload:
              if not item or not isinstance(item, str):
                  continue
              
              # 统一转成大写进行安全判断，防止大小写不一致导致失效
              upper_item = item.upper()
              
              # 判断是否属于 IP / 路由网络类规则 (包含传统IP、IPv6、ASN、GeoIP等)
              if any(upper_item.startswith(p) for p in ['IP-CIDR', 'IP-CIDR6', 'IP-ASN', 'GEOIP']):
                  ips.append(item)
              # 判断是否属于域名类规则 (包含 DOMAIN, DOMAIN-SUFFIX, DOMAIN-KEYWORD, GEOSITE等)
              elif any(upper_item.startswith(p) for p in ['DOMAIN', 'GEOSITE']):
                  domains.append(item)

          with open('emby_domain.yaml', 'w', encoding='utf-8') as f:
              yaml.dump({'payload': domains}, f, allow_unicode=True, default_flow_style=False)

          with open('emby_ip.yaml', 'w', encoding='utf-8') as f:
              yaml.dump({'payload': ips}, f, allow_unicode=True, default_flow_style=False)
          "

      # 3. 极致编译：下载 Mihomo 编译出高性能的 .mrs 文件
      - name: Compile MRS Files via Mihomo
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.18.9/mihomo-linux-amd64-v1.18.9.gz
          gunzip mihomo-linux-amd64-v1.18.9.gz
          mv mihomo-linux-amd64-v1.18.9 mihomo
          chmod +x mihomo

          ./mihomo cli ruleset compile --behavior domain emby_domain.yaml emby_domain.mrs
          ./mihomo cli ruleset compile --behavior ipcidr emby_ip.yaml emby_ip.mrs

      # 4. 统一提交
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add emby_rules.list emby_domain.mrs emby_ip.mrs
          git diff-index --quiet HEAD || git commit -m "chore: auto-sync list and split compile mrs with asn support [skip ci]"
          git push
