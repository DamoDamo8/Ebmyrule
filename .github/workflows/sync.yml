name: Auto Sync Emby Rules and Compile MRS

on:
  push:
    paths:
      - 'emby_rules.yaml'
      - '.github/workflows/*.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      # YAML 转 LIST
      - name: Convert YAML to List
        run: |
          python <<'PY'
          import re

          with open('emby_rules.yaml','r',encoding='utf-8') as f:
              lines=f.readlines()

          output=[]

          for line in lines:
              if line.strip().startswith('payload:'):
                  continue

              m=re.match(r'^(\s*)-\s+(.*)$',line)

              if m:
                  _,content=m.groups()

                  if content.startswith('#'):
                      output.append(line)
                  else:
                      output.append(content+'\n')
              else:
                  output.append(line)

          with open('emby_rules.list','w',encoding='utf-8') as f:
              f.writelines(output)

          print("list generated")
          PY


      # 分离 DOMAIN/IP
      - name: Split Rules
        run: |
          python <<'PY'
          import re

          with open('emby_rules.yaml','r',encoding='utf-8') as f:
              lines=f.readlines()

          domains=[]
          ips=[]

          for line in lines:

              m=re.match(r'^(\s*)-\s+(.*)$',line)

              if not m:
                  continue

              _,content=m.groups()

              if content.strip().startswith('#'):
                  continue

              content=re.sub(r'\s+#.*$','',content).strip()

              if not content:
                  continue

              parts=[x.strip() for x in content.split(',')]

              rule_type=parts[0].upper()

              rule=','.join(parts)


              if rule_type.startswith(
                  ('IP-CIDR','IP-ASN','GEOIP')
              ):
                  ips.append("  - "+rule+"\n")


              elif rule_type.startswith(
                  ('DOMAIN','GEOSITE')
              ):
                  domains.append("  - "+rule+"\n")


          if domains:
              with open('emby_domain.yaml','w') as f:
                  f.write("payload:\n")
                  f.writelines(domains)


          if ips:
              with open('emby_ip.yaml','w') as f:
                  f.write("payload:\n")
                  f.writelines(ips)


          print(
              f"domain:{len(domains)}, ip:{len(ips)}"
          )
          PY


      # Mihomo 编译 MRS
      - name: Compile MRS Files
        run: |
          set -e


          VERSION=v1.19.19


          wget --show-progress -q \
          https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz


          gunzip mihomo-linux-amd64-${VERSION}.gz


          mv mihomo-linux-amd64-${VERSION} mihomo


          chmod +x mihomo


          echo "Mihomo:"
          ./mihomo -v



          if [ -f emby_domain.yaml ]; then

            echo "Compile domain mrs"

            ./mihomo convert-ruleset \
              domain \
              yaml \
              emby_domain.yaml \
              emby_domain.mrs

          fi



          if [ -f emby_ip.yaml ]; then

            echo "Compile ip mrs"

            ./mihomo convert-ruleset \
              ipcidr \
              yaml \
              emby_ip.yaml \
              emby_ip.mrs

          fi



          echo "MRS compile completed"


          echo "Generated:"
          ls -lh *.mrs || true



      # 提交
      - name: Commit Changes
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add emby_rules.list


          [ -f emby_domain.mrs ] && git add emby_domain.mrs

          [ -f emby_ip.mrs ] && git add emby_ip.mrs



          if git diff --cached --quiet; then

              echo "No changes"

          else

              git commit \
              -m "chore: auto compile emby rules [skip ci]"

              git push

          fi
