name: Auto Sync List and Split Compile MRS

on:
  push:
    paths:
      - 'emby_rules.yaml' # 当你修改这个文件时触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1. 逐行纯文本处理：继续同步你的 emby_rules.list 文件
      - name: Convert YAML to List (Keep Format)
        run: |
          python -c "
          import re

          with open('emby_rules.yaml', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          output_lines = []
          for line in lines:
              if line.strip().startswith('payload:'):
                  continue
              match = re.match(r'^(\s*)-\s+(.*)$', line)
              if match:
                  indent, content = match.groups()
                  if content.startswith('#'):
                      output_lines.append(line)
                  else:
                      output_lines.append(f'{content}\n')
              else:
                  output_lines.append(line)

          with open('emby_rules.list', 'w', encoding='utf-8') as f:
              f.writelines(output_lines)
          "

      # 2. 文本流清洗：完全不通过 yaml 库解析，直接通过纯文本提取有效域名和 IP，防止因你加了 # 导致解析报错
      - name: Split YAML into Domain and IP (No-Error Version)
        run: |
          python -c "
          import re

          with open('emby_rules.yaml', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          domains = []
          ips = []

          for line in lines:
              # 匹配形如 - DOMAIN... 的行
              match = re.match(r'^(\s*)-\s+(.*)$', line)
              if match:
                  indent, content = match.groups()
                  # 如果该条规则被 # 注释掉了（如 - # DOMAIN），直接忽略它，不放入编译
                  if content.startswith('#'):
                      continue
                  
                  clean_rule = content.strip()
                  upper_rule = clean_rule.upper()
                  
                  # 智能分类
                  if any(upper_rule.startswith(p) for p in ['IP-CIDR', 'IP-CIDR6', 'IP-ASN', 'GEOIP']):
                      ips.append(f'  - {clean_rule}\n')
                  elif any(upper_rule.startswith(p) for p in ['DOMAIN', 'GEOSITE']):
                      domains.append(f'  - {clean_rule}\n')

          # 重新组装生成临时的纯净 yaml 用来编译
          with open('emby_domain.yaml', 'w', encoding='utf-8') as f:
              f.write('payload:\n')
              f.writelines(domains)

          with open('emby_ip.yaml', 'w', encoding='utf-8') as f:
              f.write('payload:\n')
              f.writelines(ips)
          "

      # 3. 极致编译：下载 Mihomo 编译出高性能的 .mrs 文件
      - name: Compile MRS Files via Mihomo
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.18.9/mihomo-linux-amd64-v1.18.9.gz
          gunzip mihomo-linux-amd64-v1.18.9.gz
          mv mihomo-linux-amd64-v1.18.9 mihomo
          chmod +x mihomo

          ./mihomo cli ruleset compile --behavior domain emby_domain.yaml emby_domain.mrs
          ./mihomo cli ruleset compile --behavior ipcidr emby_ip.yaml emby_ip.mrs

      # 4. 统一提交
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add emby_rules.list emby_domain.mrs emby_ip.mrs
          git diff-index --quiet HEAD || git commit -m "chore: auto-sync all files safely [skip ci]"
          git push
