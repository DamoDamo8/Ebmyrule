name: Build Emby Rules

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "emby_rules.yaml"
      - ".github/workflows/build-rules.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # Checkout
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # 安装 Python YAML 模块
      # ==================================================
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyyaml

      # ==================================================
      # 下载最新稳定版 Mihomo
      # ==================================================
      - name: Download latest Mihomo
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          RELEASE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API")

          TAG=$(echo "$RELEASE" | jq -r '.tag_name')

          echo "Latest Mihomo: $TAG"

          ASSET="mihomo-linux-amd64-v1-${TAG}.gz"

          URL=$(echo "$RELEASE" | jq -r \
            --arg asset "$ASSET" \
            '.assets[]
             | select(.name == $asset)
             | .browser_download_url')

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: Cannot find Mihomo asset:"
            echo "$ASSET"
            exit 1
          fi

          echo "Downloading:"
          echo "$URL"

          curl -fL "$URL" -o mihomo.gz

          gzip -d mihomo.gz
          chmod +x mihomo

          ./mihomo -v

      # ==================================================
      # 从混合 YAML 生成 LIST
      #
      # emby_rules.list
      # emby_domain.list
      # emby_ip.list
      # ==================================================
      - name: Generate LIST files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import ipaddress
          import yaml
          from pathlib import Path


          SOURCE = Path("emby_rules.yaml")


          DOMAIN_TYPES = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
              "DOMAIN-REGEX",
          }


          IP_TYPES = {
              "IP-CIDR",
              "IP-CIDR6",
          }


          # ------------------------------------------------
          # 保持原顺序去重
          # ------------------------------------------------
          def dedupe(items):
              seen = set()
              result = []

              for item in items:
                  if item not in seen:
                      seen.add(item)
                      result.append(item)

              return result


          # ------------------------------------------------
          # 检查域名
          # ------------------------------------------------
          def validate_domain(value, rule):

              if not value:
                  raise ValueError(
                      f"空域名规则: {rule}"
                  )

              if "://" in value:
                  raise ValueError(
                      f"发现 URL，不是域名规则: {rule}"
                  )

              if "/" in value:
                  raise ValueError(
                      f"域名包含 /，请检查: {rule}"
                  )


          # ------------------------------------------------
          # 读取 YAML
          # ------------------------------------------------
          if not SOURCE.exists():
              raise SystemExit(
                  "ERROR: 找不到 emby_rules.yaml"
              )


          with SOURCE.open(
              "r",
              encoding="utf-8"
          ) as f:

              data = yaml.safe_load(f)


          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: YAML 顶层格式错误"
              )


          payload = data.get("payload")


          if not isinstance(payload, list):
              raise SystemExit(
                  "ERROR: 找不到 payload 列表"
              )


          classical_rules = []
          domain_rules = []
          ip_rules = []

          unsupported = []


          # ------------------------------------------------
          # 开始处理规则
          # ------------------------------------------------
          for number, item in enumerate(
              payload,
              start=1
          ):

              if item is None:
                  continue

              rule = str(item).strip()

              if not rule:
                  continue


              # --------------------------------------------
              # 检测缺少逗号
              # --------------------------------------------
              if (
                  rule.startswith("DOMAIN")
                  or rule.startswith("IP-CIDR")
              ) and "," not in rule:

                  raise ValueError(
                      f"第 {number} 条规则疑似缺少逗号:\n"
                      f"{rule}"
                  )


              if "," not in rule:
                  raise ValueError(
                      f"第 {number} 条规则无法识别:\n"
                      f"{rule}"
                  )


              rule_type, remainder = rule.split(
                  ",",
                  1
              )

              rule_type = rule_type.strip().upper()


              # ============================================
              # DOMAIN
              # ============================================
              if rule_type in DOMAIN_TYPES:

                  if rule_type == "DOMAIN-REGEX":

                      value = remainder.strip()

                  else:

                      value = (
                          remainder
                          .split(",", 1)[0]
                          .strip()
                      )


                  validate_domain(
                      value,
                      rule,
                  )


                  classical_rules.append(rule)


                  if rule_type == "DOMAIN":

                      domain_rules.append(
                          f"full:{value}"
                      )


                  elif rule_type == "DOMAIN-SUFFIX":

                      domain_rules.append(
                          value
                      )


                  elif rule_type == "DOMAIN-KEYWORD":

                      domain_rules.append(
                          f"keyword:{value}"
                      )


                  elif rule_type == "DOMAIN-REGEX":

                      domain_rules.append(
                          f"regexp:{value}"
                      )


                  continue


              # ============================================
              # IP-CIDR / IP-CIDR6
              # ============================================
              if rule_type in IP_TYPES:

                  value = (
                      remainder
                      .split(",", 1)[0]
                      .strip()
                  )


                  try:

                      ipaddress.ip_network(
                          value,
                          strict=False,
                      )

                  except ValueError:

                      raise ValueError(
                          f"无效 IP/CIDR:\n{rule}"
                      )


                  classical_rules.append(rule)
                  ip_rules.append(value)

                  continue


              # ============================================
              # 其他 classical 类型
              # 保留到 emby_rules.list
              # 不进入 MRS
              # ============================================
              classical_rules.append(rule)
              unsupported.append(rule)


          # ------------------------------------------------
          # 去重
          # ------------------------------------------------
          classical_rules = dedupe(
              classical_rules
          )

          domain_rules = dedupe(
              domain_rules
          )

          ip_rules = dedupe(
              ip_rules
          )


          # ------------------------------------------------
          # 检查
          # ------------------------------------------------
          if not domain_rules:
              raise SystemExit(
                  "ERROR: 没有找到域名规则"
              )


          if not ip_rules:
              print(
                  "WARNING: 没有找到 IP-CIDR 规则"
              )


          # ------------------------------------------------
          # 直接写入仓库根目录
          # ------------------------------------------------
          Path("emby_rules.list").write_text(
              "\n".join(classical_rules) + "\n",
              encoding="utf-8",
          )


          Path("emby_domain.list").write_text(
              "\n".join(domain_rules) + "\n",
              encoding="utf-8",
          )


          Path("emby_ip.list").write_text(
              "\n".join(ip_rules)
              + ("\n" if ip_rules else ""),
              encoding="utf-8",
          )


          # ------------------------------------------------
          # 输出统计
          # ------------------------------------------------
          print()
          print("=" * 50)
          print("Rule Build Summary")
          print("=" * 50)

          print(
              f"Classical : {len(classical_rules)}"
          )

          print(
              f"Domain    : {len(domain_rules)}"
          )

          print(
              f"IP/CIDR   : {len(ip_rules)}"
          )


          if unsupported:

              print()
              print(
                  "以下规则只保留在 emby_rules.list，"
                  "不会进入 MRS:"
              )

              for rule in unsupported:
                  print(
                      f"  {rule}"
                  )


          print()
          print("LIST generation completed.")

          PY

      # ==================================================
      # DOMAIN LIST -> MRS
      # ==================================================
      - name: Build Domain MRS
        shell: bash
        run: |
          set -euo pipefail

          ./mihomo convert-ruleset \
            domain \
            text \
            emby_domain.list \
            emby_domain.mrs

      # ==================================================
      # IP LIST -> MRS
      # ==================================================
      - name: Build IP MRS
        shell: bash
        run: |
          set -euo pipefail

          if [ -s emby_ip.list ]; then

            ./mihomo convert-ruleset \
              ipcidr \
              text \
              emby_ip.list \
              emby_ip.mrs

          else

            echo "No IP rules."
            rm -f emby_ip.mrs

          fi

      # ==================================================
      # 显示生成文件
      # ==================================================
      - name: Show generated files
        shell: bash
        run: |
          echo
          echo "================================="
          echo "Generated files"
          echo "================================="

          ls -lh \
            emby_rules.list \
            emby_domain.list \
            emby_ip.list \
            emby_domain.mrs \
            emby_ip.mrs

          echo
          echo "================================="
          echo "Classical LIST"
          echo "================================="

          cat emby_rules.list

          echo
          echo "================================="
          echo "Domain LIST"
          echo "================================="

          cat emby_domain.list

          echo
          echo "================================="
          echo "IP LIST"
          echo "================================="

          cat emby_ip.list

      # ==================================================
      # 自动提交回 main
      # ==================================================
      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            emby_rules.list \
            emby_domain.list \
            emby_ip.list \
            emby_domain.mrs \
            emby_ip.mrs

          if git diff --cached --quiet; then
            echo "Rules have not changed."
            exit 0
          fi

          git commit \
            -m "chore: update generated Emby rules"

          git push
